apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

# Point this at the image CI publishes, e.g.:
#   kustomize edit set image ghcr.io/CHANGE-ME/taskflow-api=ghcr.io/<owner>/taskflow-api:latest
images:
  - name: ghcr.io/CHANGE-ME/taskflow-api
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: taskflow
