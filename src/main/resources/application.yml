spring:
  application:
    name: taskflow-api

  datasource:
    url: ${TASKFLOW_DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${TASKFLOW_DB_USER:taskflow}
    password: ${TASKFLOW_DB_PASSWORD:taskflow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP_UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    baseline-on-migrate: false

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Task and project management REST API
    version: '@project.version@'

taskflow:
  jwt:
    # Override in every real environment. HS256 needs at least 32 bytes of key material.
    secret: ${TASKFLOW_JWT_SECRET:dev-only-secret-change-me-000000000000000000000000000000}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    issuer: taskflow-api

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:info}
