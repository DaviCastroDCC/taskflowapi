# Full local stack: API + PostgreSQL + Prometheus + Grafana.
#
#   docker compose up -d db          # just the database, for `./mvnw spring-boot:run`
#   docker compose up --build        # everything, API included
#
# Grafana:    http://localhost:3000  (admin / admin)
# Prometheus: http://localhost:9090
# API:        http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-api:local
    container_name: taskflow-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      TASKFLOW_DB_URL: jdbc:postgresql://db:5432/taskflow
      TASKFLOW_DB_USER: taskflow
      TASKFLOW_DB_PASSWORD: taskflow
      TASKFLOW_JWT_SECRET: ${TASKFLOW_JWT_SECRET:-dev-only-secret-change-me-000000000000000000000000000000}
    ports:
      - "8080:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: taskflow-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: taskflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - taskflow-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  taskflow-db-data:
  taskflow-grafana-data:
