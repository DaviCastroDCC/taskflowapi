global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: taskflow-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          application: taskflow-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
